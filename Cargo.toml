[package]
name = "cheapedit"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
drag = "2.1.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "links", "clipboard"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libloading = "0.9.0"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
raw-window-handle = "0.6"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Time"] }
winreg = "0.56.0"

[dev-dependencies]
ico = "0.6.0"
resvg = "0.49.0"

[build-dependencies]
winresource = "0.1.34"

# Dev builds: our code compiles fast, libraries are optimised so the UI stays smooth.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

